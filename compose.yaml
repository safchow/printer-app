# Printer app. Copy .env.example to .env and printers.example.yaml to
# printers.yaml, then: docker compose up -d --build
#
# The web app is published only on BIND_ADDRESS (127.0.0.1 unless you set a
# private VPN or LAN address in .env). printer-slicer joins in a later version.
name: printer

services:
  printer-api:
    build: .
    image: printer-api:local
    container_name: printer-api
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      TZ: ${TZ:-UTC}
      IMPORT_TOKEN: ${IMPORT_TOKEN:-}
      TAILSCALE_SOCKET: ${TAILSCALE_SOCKET:-}
      CAMERA_MIN_INTERVAL: ${CAMERA_MIN_INTERVAL:-5}
      # Printer controls (pause, speed, fans, temperatures, light). Off by default.
      CONTROLS_ENABLED: ${CONTROLS_ENABLED:-false}
      # Camera relay. Set GO2RTC_URL= (empty) in .env to go back to browsers
      # connecting to the printer's camera directly.
      GO2RTC_URL: ${GO2RTC_URL-http://go2rtc:1984}
      CAMERA_CALLBACK_URL: http://printer-api:8090
    volumes:
      - ${PRINTERS_FILE:-./printers.yaml}:/config/printers.yaml:ro
      - ${DATA_DIR:-./data}:/data
      - ${LIBRARY_ROOT:-./library}:/library
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8090}:8090"
    depends_on:
      - go2rtc

  # Camera relay: holds the one connection to each printer's camera while
  # someone is watching, and serves the video to the app. Nothing published.
  go2rtc:
    image: alexxit/go2rtc:1.9.14
    container_name: printer-go2rtc
    restart: unless-stopped
    volumes:
      - ./go2rtc.yaml:/config/go2rtc.yaml:ro

  # A fake K1C for trying the app without a printer:
  #   PRINTERS_FILE=./printers.fake.yaml docker compose --profile fake up -d --build
  fake-moonraker:
    profiles: [fake]
    image: printer-api:local
    container_name: printer-fake-moonraker
    command: ["python", "/fakes/fake_moonraker.py", "--host", "0.0.0.0", "--port", "7125", "--camera-port", "8000"]
    healthcheck:
      disable: true
