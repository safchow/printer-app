<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#09090b" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Printers</title>
    <script>
      // Paint the last theme before first paint so there is no flash (src/hooks/useTheme.tsx).
      try {
        var a = JSON.parse(localStorage.getItem("printer-theme-applied") || "null");
        var root = document.documentElement;
        if (a && a.vars) {
          for (var k in a.vars) root.style.setProperty(k, a.vars[k]);
          root.classList.toggle("dark", !!a.dark);
          document.querySelector('meta[name="theme-color"]').setAttribute("content", a.vars["--background"]);
        } else {
          root.classList.toggle("dark", matchMedia("(prefers-color-scheme: dark)").matches);
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
